name: Python checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  checks:
    name: checks (${{ matrix.os }}, ${{ matrix.python }})
    env:
      PYTHON_PIN: ${{ matrix.python == '3.11' && '3.11.16' || '3.14.7' }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python: ['3.11', '3.14']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux Qt runtime prerequisite
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends libegl1
          dpkg-query --show libegl1 libglvnd0
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.12.21'
      - run: uv python install ${{ env.PYTHON_PIN }}
      - run: uv sync --locked --python ${{ env.PYTHON_PIN }}
      - run: uv run --no-sync ruff check .
      - run: uv run --no-sync ruff format --check .
      - run: uv run --no-sync mypy src
      - run: uv run --no-sync pytest
      - run: uv run --no-sync suno2flp --help
      - run: uv build
      - name: Check distribution privacy
        env:
          SUNO2FLP_PACKAGE_ARTIFACTS: dist
        run: uv run --no-sync pytest tests/integration/test_distribution_external.py
      - run: uv export --locked --no-dev --no-hashes --no-emit-project --output-file runtime-smoke-requirements.tmp
      - run: uv run --no-project --python ${{ env.PYTHON_PIN }} --with ./dist/suno2flp-0.1.0-py3-none-any.whl --with-requirements runtime-smoke-requirements.tmp python scripts/offline_smoke.py --require-installed --workspace .tools/ci-offline-smoke
      - run: uv run --no-project --python ${{ env.PYTHON_PIN }} --with ./dist/suno2flp-0.1.0-py3-none-any.whl --with-requirements runtime-smoke-requirements.tmp python scripts/note_score_smoke.py --require-installed --workspace .tools/ci-note-score-smoke
      - run: uv run --no-project --python ${{ env.PYTHON_PIN }} --with ./dist/suno2flp-0.1.0-py3-none-any.whl --with-requirements runtime-smoke-requirements.tmp python scripts/transcription_smoke.py --require-installed --workspace .tools/ci-transcription-smoke
      - run: uv run --no-project --python ${{ env.PYTHON_PIN }} --with ./dist/suno2flp-0.1.0-py3-none-any.whl --with-requirements runtime-smoke-requirements.tmp python scripts/separation_smoke.py --require-installed --workspace .tools/ci-separation-smoke
      - run: uv run --no-project --python ${{ env.PYTHON_PIN }} --with ./dist/suno2flp-0.1.0-py3-none-any.whl --with-requirements runtime-smoke-requirements.tmp python scripts/codec_smoke.py --require-installed --workspace .tools/ci-codec-smoke
      - run: uv export --locked --no-dev --extra gui --no-hashes --no-emit-project --output-file gui-smoke-requirements.tmp
      - run: uv run --no-project --python ${{ env.PYTHON_PIN }} --with './dist/suno2flp-0.1.0-py3-none-any.whl[gui]' --with-requirements gui-smoke-requirements.tmp python scripts/gui_smoke.py --require-installed --workspace .tools/ci-gui-smoke
